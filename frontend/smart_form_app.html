<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-green-50 h-screen flex overflow-hidden">

    <!-- VIEW 1: LOGIN / DATA COLLECTION -->
    <div id="login-view" class="w-full h-full flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
            <div class="flex items-center justify-center mb-6 text-green-700 gap-2">
                <i data-lucide="sprout" class="w-8 h-8"></i>
                <h1 class="text-2xl font-bold">SmartFarm Login</h1>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Farmer Name</label>
                    <input type="text" id="farmerName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Region</label>
                        <select id="region" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                            <option value="North India">North India</option>
                            <option value="South India">South India</option>
                            <option value="East India">East India</option>
                            <option value="West India">West India</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Location (City)</label>
                        <input type="text" id="location" value="Delhi" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Crop to Grow</label>
                    <select id="crop" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="Wheat">Wheat</option>
                        <option value="Rice">Rice</option>
                        <option value="Maize">Maize</option>
                        <option value="Cotton">Cotton</option>
                        <option value="Sugarcane">Sugarcane</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Land Size (Acres)</label>
                        <input type="number" id="landSize" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Irrigation Type</label>
                        <select id="irrigation" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                            <option value="Canal">Canal</option>
                            <option value="Well">Well</option>
                            <option value="Drip">Drip</option>
                            <option value="Rainfed">Rainfed</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Fertilizer Used</label>
                    <select id="fertilizer" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="Urea">Urea</option>
                        <option value="DAP">DAP</option>
                        <option value="Organic">Organic</option>
                    </select>
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Go to Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- VIEW 2: DASHBOARD (Hidden by default) -->
    <div id="dashboard-view" class="hidden w-full h-full flex-col">
        <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <i data-lucide="layout-dashboard" class="text-green-600"></i>
                <h1 class="text-xl font-bold text-gray-800">Farm Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="welcome-msg" class="text-gray-600 font-medium"></span>
                <button onclick="window.location.reload()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            <!-- Prediction Card -->
            <div class="mb-8 bg-gradient-to-r from-green-600 to-emerald-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold mb-2">Yield Prediction</h2>
                    <p class="opacity-90 mb-4">Based on your inputs and live weather conditions.</p>
                    
                    <div class="flex items-end gap-4">
                        <div class="text-5xl font-bold" id="prediction-value">--</div>
                        <div class="text-xl mb-2 opacity-90" id="prediction-unit">kg/hectare</div>
                    </div>
                    <div id="prediction-loading" class="hidden mt-2 text-sm animate-pulse">Calculating prediction...</div>
                </div>
                <i data-lucide="trending-up" class="absolute right-4 bottom-4 w-32 h-32 opacity-20"></i>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <!-- Weather Card -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-gray-500 text-sm font-medium uppercase">Live Weather</h3>
                            <p id="weather-loc" class="text-xs text-gray-400">Loading...</p>
                        </div>
                        <i data-lucide="cloud-sun" class="text-orange-400"></i>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="weather-temp" class="text-3xl font-bold text-gray-800">--</span>
                        <span class="text-xl text-gray-500">°C</span>
                    </div>
                    <p id="weather-desc" class="text-gray-500 mt-1 capitalize">--</p>
                </div>

                <!-- Input Summary Card -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-gray-500 text-sm font-medium uppercase">Farm Details</h3>
                        <i data-lucide="clipboard-list" class="text-blue-500"></i>
                    </div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between"><span>Crop:</span> <span id="display-crop" class="font-semibold">--</span></div>
                        <div class="flex justify-between"><span>Land:</span> <span id="display-land" class="font-semibold">--</span></div>
                        <div class="flex justify-between"><span>Irrigation:</span> <span id="display-irrigation" class="font-semibold">--</span></div>
                    </div>
                </div>

                 <!-- Market Price Card (Mock) -->
                 <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-gray-500 text-sm font-medium uppercase">Market Estimates</h3>
                        <i data-lucide="coins" class="text-yellow-500"></i>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-3xl font-bold text-gray-800">₹ 2,450</span>
                        <span class="text-sm text-gray-500">/ quintal</span>
                    </div>
                    <p class="text-green-600 text-sm mt-1 flex items-center gap-1"><i data-lucide="arrow-up" class="w-3 h-3"></i> 2.4% vs last week</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');

        // --- DATA STORE ---
        let userData = {};

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Collect User Data
            userData = {
                name: document.getElementById('farmerName').value,
                region: document.getElementById('region').value,
                location: document.getElementById('location').value,
                crop: document.getElementById('crop').value,
                landSize: document.getElementById('landSize').value,
                irrigation: document.getElementById('irrigation').value,
                fertilizer: document.getElementById('fertilizer').value
            };

            // 2. Switch Views
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            dashboardView.classList.add('flex'); // Make it visible and flex

            // 3. Update Dashboard UI
            document.getElementById('welcome-msg').textContent = `Welcome, ${userData.name}`;
            document.getElementById('display-crop').textContent = userData.crop;
            document.getElementById('display-land').textContent = `${userData.landSize} Acres`;
            document.getElementById('display-irrigation').textContent = userData.irrigation;
            document.getElementById('weather-loc').textContent = userData.location;

            // 4. Fetch Weather & Predict
            await fetchWeatherAndPredict();
        });

        async function fetchWeatherAndPredict() {
            // A. Get Weather
            let temp = 25; // Default
            let rain = 100; // Default
            
            try {
                const weatherRes = await fetch('http://localhost:3001/api/weather', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: userData.location })
                });
                const weatherData = await weatherRes.json();
                
                if (weatherData.temp) {
                    temp = weatherData.temp;
                    document.getElementById('weather-temp').textContent = temp;
                    document.getElementById('weather-desc').textContent = weatherData.description;
                }
            } catch (e) {
                console.error("Weather error:", e);
                document.getElementById('weather-desc').textContent = "Weather Unavailable";
            }

            // B. Predict Yield (Call Backend Model)
            document.getElementById('prediction-loading').classList.remove('hidden');
            
            try {
                const predictRes = await fetch('http://localhost:3001/api/predict-yield', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        region: userData.region,
                        crop: userData.crop,
                        irrigation: userData.irrigation,
                        fertilizer: userData.fertilizer,
                        temp: temp,
                        rain: rain
                    })
                });
                
                const prediction = await predictRes.json();
                document.getElementById('prediction-value').textContent = prediction.predicted_yield;
                
            } catch (e) {
                console.error("Prediction error:", e);
                document.getElementById('prediction-value').textContent = "Error";
            } finally {
                document.getElementById('prediction-loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
